name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production   # з'являється у блоці Deployments
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'   # як у <TargetFramework>

      - name: Build WebJob package
        run: |
          echo "--- Files in repo ---"
          find . -name "*.csproj" -o -name "*.sln" | grep -v "/\.git/"
          CSPROJ=$(find . -name "*.csproj" | head -n 1)
          if [ -z "$CSPROJ" ]; then echo "csproj not found"; exit 1; fi
          echo "Using $CSPROJ"
          JOB=stage/App_Data/jobs/continuous/bot
          mkdir -p $JOB
          dotnet publish "$CSPROJ" -c Release -o $JOB
          printf 'dotnet Chulii_tg_bot.dll\r\n' > $JOB/run.cmd
          cd stage && zip -r ../webjob.zip .

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: chulii-tg-bot-123
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: webjob.zip